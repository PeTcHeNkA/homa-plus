package protobuf;

option go_package = "/Lang";

message Item {
  required int64 id  = 1;
  optional string name = 2;
}

message IndexItem {
  required uint32 beginOff = 1;
  required uint32 length   = 2;
}

message Index {
  optional uint32 dist = 1;
  optional bool   sect = 2;
  map<uint32, IndexItem> index = 3;
}

message Translations {
  repeated Item data = 1;
}