        :root{
            --color-blg: rgba(42, 42, 42, 0.876);

            --menu-gray: rgba(149, 149, 149, 0.537);
            --text-white: rgb(255, 255, 255);
            --text-gray: rgba(228, 228, 228, 0.721);
        }
        div, body{
            padding: 0; margin: 0; user-select: none;
            touch-action: none;
        }
        .overflow-hide{
            overflow: hidden
        }
        .v_frame{
            width: 100vw;
            height: var(--btn-sz);
            background-color: var(--color-blg);

        }

            width: 3.5em;

            color: var(--text-gray)
        }

            --col: var(--text-white);
            background-color: var(--menu-gray)
        }
        .v_close:hover{
            --col: var(--text-white);
            background-color: rgba(255, 0, 0);
        }
        .v_frame_nm{
            font-size: calc(var(--btn-sz)*0.55);
            width: unset;
            height: unset;
        }
        @media screen and (max-width: 400px) {
            .v_frame_nm_min{
                display: none;
            }
        }
    </style>

            return /[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/.test(login)?login:false;

            return /^(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z])(?=.*[!#$%?@-_+=^:;.<>*])(?=\S+$).{8,24}$/.test(psw)?psw:false;

        function validNick(nick){
            return (nick.length>3 && nick.length < 16 && /^\w+$/.test(nick))?nick:false

            <script>
                const frame ='<div id="SCR_%ID%" onclick='+"showBigScreen('%URL%')"+' class="screen %POS%" style="background-image: url(%URL%)"></div>'
    
                var ld = "."
                var screens = []
                var noScroolScreens = false

                async function getScreens(){
                    let lcp = await GetLaunchPatch()
                    let data = await GetFiles(lcp+"/screenshots")
                    return data.split(";")
                }
    
                function getScreen(id){
                    let num = id % screens.length
                    if(num<0)num += screens.length
                    return screens[num]
                }
    
                var centerId = 0
                var timeOut = 40
                var timeRem = 40

                function addEScreen(){
                    let html = frame.replace("%ID%",centerId).replace("%POS%", "posP")
                    str = getScreen(centerId+1)
                    if(str=="NONE"){
                        return
                    }
                    html = html.replace("%URL%",str).replace("%URL%",str)
                    getEl("FRM").innerHTML+=html
                    setTimeout(()=>{
                        P0 = getEl("SCR_"+(centerId))
                        if(P0 != null){
                            P0.className="screen pos3"
                        }
    
                        P1 = getEl("SCR_"+(centerId-1))
                        if(P1 != null){
                            P1.className="screen pos2"
                        }
                        P2 = getEl("SCR_"+(centerId-2))
                        if(P2 != null){
                            P2.className="screen pos1"
                        }
                        P3 = getEl("SCR_"+(centerId-3))
                        if(P3 != null){
                            P3.className="screen pos0"
                        }
                        const P4 = getEl("SCR_"+(centerId-4))
                        if(P4 != null){
                            P4.className="screen posN"
                            setTimeout(()=>{P4.remove()}, timeRem)
                        }
                        centerId+=1
                    },timeOut)
                }
    
                function backScreen(){
                    let html = frame.replace("%ID%",centerId-5).replace("%POS%", "posN")
                    str = getScreen(centerId-5)
                    if(str=="NONE"){
                        return
                    }
                    html = html.replace("%URL%",str).replace("%URL%",str)
                    getEl("FRM").innerHTML+=html
                    setTimeout(()=>{
                        getEl("SCR_"+(centerId-5)).className="screen pos0"
                        P0 = getEl("SCR_"+(centerId-1))
                        if(P0 != null){
                            P0.className="screen posP"
                            setTimeout(()=>{P0.remove()}, timeRem)
                        }
                        P1 = getEl("SCR_"+(centerId-2))
                        if(P1 != null){
                            P1.className="screen pos3"
                        }
                        P2 = getEl("SCR_"+(centerId-3))
                        if(P2 != null){
                            P2.className="screen pos2"
                        }
                        P3 = getEl("SCR_"+(centerId-4))
                        if(P3 != null){
                            P3.className="screen pos1"
                        }
                        centerId-=1
                    }, timeOut)
                }

                function onScrool(e) {
                    if(blocked || noScroolScreens)return;
                    if(e.deltaY==0)return;
                    setTimeout(()=>{blocked = false}, 40)
                    blocked = true
                    if(e.deltaY<0){
                        addEScreen()
                    } else {
                        backScreen()
                    }
                }
                
            </script>
            <script>
                function onInitScreens(){
                    setTimeout(addEScreen, 600)
                    setTimeout(addEScreen, 900)
                    setTimeout(addEScreen, 1200)

            <script>
                var nip = false, inStart = false, token = "", hasNet = false, userName = "User", uuid = "offline"
                const INPUT_PSW = getEl("INPUT_PSW")
                const INPUT_NICK = getEl("INPUT_NICK")
                const RPF_LN = getEl("PRG_LN")
                const STEXT = getEl("STEXT")
                const STATUS = getEl("STATUS")

                const authserv = "https://lochost.ru"

                const a_msg = "Авторизация"
                const stg_msg = "Начать Игру"

                function inputMode(mode=true){
                    nip = mode
                    getEl("lgo-ico").style.display=mode?"":"none"
                    getEl("inpswctn").style.width=mode?"11%":"100%"
                    INPUT_PSW.style.width=mode?"0%":"100%"
                    
                    if(mode){
                        INPUT_NICK.setAttribute("readonly", true)
                    } else{
                        token = ""
                        INPUT_NICK.removeAttribute("readonly")
                    }
                    saveCache()
                    STEXT.innerHTML=mode?stg_msg:a_msg
                }
                STEXT.innerHTML=nip?stg_msg:a_msg
                function logout0(){
                    if(!nip)return
                    post(authserv+"/auth/api/logouthclient", token, (res)=>{
                        if(!nip)return
                        inputMode(false)
                    })
                }

                function onLogin(login, password){
                    get(authserv+"/auth/authclient?login="+login+"&psw="+password, (res)=>{
                        if(res.startsWith("ERROR")){
                            let code = res.split(" ")[1];
                            if(code=="NULL_USER"){
                                redStartBar0("Пользователь не найден!", a_msg, "2.5em")
                            }
                            if(code=="WRONG_PASSWORD"){
                                redStartBar0("Неправильный пароль!", a_msg, "2.7em")
                            }
                            console.log(code);
                            return;
                        }
                        token = res
                        inputMode(true)
                    })
                }

                //INPUT_PSW.addEventListener("click",()=>inputMode(true))

                function showStartBar(msg="Запуск"){
                    inStart = true
                    $T("PRG").style.opacity=1
                    RPF_LN.style.width=0
                    RPF_LN.style.backgroundColor="var(--defColor)"
                    STEXT.innerHTML=msg
                }
                function hideStartBar(msg="Начать Игру"){
                    $T("PRG").style.opacity=0
                    STEXT.innerHTML=msg
                    setTimeout(()=>{inStart = false}, 1000)
                }
                function updateStatBar(i, msg=null){
                    RPF_LN.style.width=(i+"%")
                    RPF_LN.style.backgroundColor="var(--defColor)"
                    if(msg != null){
                        STEXT.innerHTML=msg
                    }
                }
                function redStartBar(msg="Ошибка", msg2="Начать игру", fs="100%", fs2="100%"){
                    RPF_LN.style.backgroundColor="var(--errorColor)"
                    if(msg != null){
                        STEXT.innerHTML=msg
                        STEXT.style.fontSize=fs
                    }
                    setTimeout(()=>{
                        inStart = false
                        getEl("PRG").style.opacity=0
                        STEXT.style.fontSize=fs2
                        STEXT.innerHTML=msg2
                        RPF_LN.style.width=0
                    }, 2500)
                }

                function redStartBar0(msg, msg2, fs, fs2){
                    RPF_LN.style.width="100%"
                    getEl("PRG").style.opacity=1
                    redStartBar(msg, msg2, fs, fs2)
                }

                function noNet(){
                    redStartBar0("Подключение отсутствует!", a_msg, "65%")
                }
        
                function clickPlay(){
                    if(!hasNet){
                        try{
                            updateAuthIfNeed(()=>{
                                if(!hasNet){
                                    noNet()
                                }
                            })
                        } catch (e){
                            noNet()
                            return
                        }
                    }
                    if(!nip){
                        let nick0 = INPUT_NICK.value
                        if(isValidLogin(nick0)){
                            let psw = INPUT_PSW.value
                            if(isValidPsw(psw)){
                                try{
                                    onLogin(nick0, psw)
                                } catch (e){
                                    console.log(e);
                                    noNet()
                                }
                            } else{
                                redStartBar0("Недопустимый пароль!", a_msg, "65%")
                            }
                        } else{
                            redStartBar0("Недопустимый логин!", a_msg, "70%")
                        }
                    } else{
                        if(!inStart){
                            ClickPlay("status", JSON.stringify(startParamsVw), userName, uuid, token)
                        }
                    }
                }
                function status(str) {
                    if(str=="empty"){
                        str=""
                    }
                    STATUS.innerHTML = str
                }
            </script>

    <script>
        var jcache = {}
        
        function loadCache(cb=()=>{}){
            console.log("LOADING CACHE");
            try{
                GetCache("vwlaunch.cache").then((res)=>{
                    jcache = JSON.parse(res)
                    INPUT_NICK.value = jcache["login"]
                    INPUT_PSW.value  = jcache["password"]
                    token            = jcache["token"]
                    MEMMAIN.value    = jcache["max-mem"]
                    cb()
                    updateMEM()
                })
            } catch(e){
                console.log(e);
            }
        }

        function saveCache(){
            jcache["token"] = token
            jcache["login"] = INPUT_NICK.value
            jcache["password"] = INPUT_PSW.value
            if(window.SetCache){
                SetCache("vwlaunch.cache", JSON.stringify(jcache))
            }
        }

        function updateAuthIfNeed(cb=()=>{}){
            if(token != ""){
                post(authserv+"/auth/api/username", token, (res)=>{
                    hasNet = true
                    if(res!="NULL"){
                        inputMode(true)
                        res = res.split(";")
                        userName = res[0]
                        uuid     = res[1]
                    }
                    cb()
                })
            }
        }

        window.onload = ()=>{
            try{
                loadCache(updateAuthIfNeed)
            } catch (e){
                console.log(e);
            }
        }
    </script>
