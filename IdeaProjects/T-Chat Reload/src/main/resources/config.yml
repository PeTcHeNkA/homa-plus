#Инструкция по использованию модуля AdventureChat
#Команды /achat ,/adventurechat
#Для начала нужно выбрать игроков, или группу игроков, которым отправить сообщение
#Далее внимательно пишите свое сообщение.

#Правила обработки компонента плагином
# - Все символы & будут заменены на цветовые коды
# - Все символы $ будут заменены на знак &, но не будут заменены на цветовые коды
# - Все символы + будут заменены на символ перехода на новую строку.
# - Все символы _ будут заменены на пробелы
# - Так-же поддерживаются подстановки от PlaceHolderAPI

#Правила сборки компонентов сообщения
#Аргументы команды записываются в сообщение друг за другом, без пробелов.
#Каждый новый аргумент команды - новый компонент сообщения,
#За исключением тех случаев, когда в начале аргумента находится расширенный тег.
#Если в начале строки стоит тег, то этот тег применяется к предедущему компоненту.
#Строка, которая следует за тегом - переходит в хранилище тега.

#Расширенные теги
# @H  - Всплывающая подсказка для текста.
# Поддерживаются подстановки, работают общие правила обработки компанента
# @U  - Предложить переход по ссылке.
# Поддерживаются подстановки, общие правила обработки не работают.
# @C  - Выполнить команду относительно нажавшего.
# Строка помещается в хранилище тега без изминений
# @S  - Предложить выполнить команду
# Строка помещается в хранилище тега без изминений

#Способы выделения целевых игроков:
# global         - все игроки
# all            - все игроки
# local          - все игроки, в радиусе действия локального чата
# %player_name%  - игрок, который находится в сети

#Примеры использования:
#/achat global &6&lВаше_сообщение+Новая_строка
#/achat &d(Нажмин_на_меня) @C!Я_нажал_на_тебя +Новая_строка_&cБез_доп._функций

