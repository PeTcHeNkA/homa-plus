plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

compileJava.options.encoding = 'UTF-8'
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    //from te4net
    implementation 'org.sejda.imageio:webp-imageio:0.1.6'
    implementation 'org.xerial:sqlite-jdbc:3.40.1.0'
    implementation 'ch.astorm:smtp4j:3.0.1'
    implementation 'com.sun.mail:jakarta.mail:2.0.1'
    implementation 'com.aayushatharva.brotli4j:brotli4j:1.11.0'
    implementation 'com.aayushatharva.brotli4j:native-windows-x86_64:1.11.0'
    implementation 'com.aayushatharva.brotli4j:native-linux-x86_64:1.11.0'
    implementation 'io.netty:netty-all:4.1.94.Final'
    implementation 'io.netty:netty-handler-ssl-ocsp:4.1.94.Final'
    implementation 'io.netty:netty-codec-http2:4.1.94.Final'
    implementation 'io.netty:netty-transport-native-epoll:4.1.90.Final'
    implementation 'io.netty:netty-tcnative-boringssl-static:2.0.59.Final'
    implementation 'io.netty:netty-tcnative:2.0.59.Final:linux-x86_64'
    //from te4net end


    implementation "net.dv8tion:JDA:5.0.0-beta.20"
    implementation 'ch.qos.logback:logback-classic:1.4.6'
    implementation 'it.unimi.dsi:fastutil:8.5.12'
    implementation 'org.ow2.asm:asm-util:9.5'
    implementation 'org.ow2.asm:asm-tree:9.5'
    implementation 'org.ow2.asm:asm-analysis:9.5'
}

sourceSets {
    main {
        java {
            srcDir 'C:/Users/Te4hnoPlus/IdeaProjects/TsonConfigurations/core/src/main/java'
            srcDir 'C:/Users/Te4hnoPlus/IdeaProjects/TsonConfigurations/extensions/src/main/java'

            srcDir 'C:/Users/Te4hnoPlus/IdeaProjects/te4_async_utls/src/main/java'
            srcDir 'C:/Users/Te4hnoPlus/IdeaProjects/te4_plugin_system/src/main/java'

            srcDir 'C:/Users/Te4hnoPlus/IdeaProjects/te4net/src/main/java'
        }
    }
}

jar {
    baseName "tsoncord-yandere"
    manifest {
        attributes(
                'Main-Class': 'plus.ds.Main'
        )
    }
}

test {
    useJUnitPlatform()
}