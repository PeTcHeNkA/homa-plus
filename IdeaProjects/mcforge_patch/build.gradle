
def name = 'te4_forgepatch'

buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://plugins.gradle.org/m2" }
        maven { url = "https://repo.spongepowered.org/maven" }
        maven { url = "https://maven.minecraftforge.net/" }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle',
                version: '4.1.+', changing: true

        classpath 'com.github.gmazzo:gradle-buildconfig-plugin:3.0.0'
    }
}

apply plugin: 'net.minecraftforge.gradle'
//плагин с константами, полезная вещь
//apply plugin: 'com.github.gmazzo.buildconfig'


version = "1.0"
group = "plus"
archivesBaseName = name
sourceCompatibility = targetCompatibility = 1.8
compileJava.options.encoding = compileTestJava.options.encoding = "UTF-8"

minecraft {
    mappings channel: 'stable', version: "39-1.12"

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }
    }
}

task prepareAssets(type: Copy) {
    group = 'build'
    from project.file('src/main/resources')
    into project.file('build/classes/java/main')
}

repositories {
    flatDir { dirs 'lib' }
}

dependencies {
    minecraft "net.minecraftforge:forge:1.12.2-14.23.5.2860"

    implementation fileTree("clib")
    //твои мод-зависимости
    //implementation fg.deobf('plus.fs:te4_fserver:1.0')
}

task ClientBuild{
    dependsOn build
}
task ServerBuild{
    dependsOn build
}


jar {
    archiveName 'server-'+name+".jar"



