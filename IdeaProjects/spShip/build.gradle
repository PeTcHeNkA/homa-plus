plugins {
    id 'java'
//    id 'org.jetbrains.kotlin.jvm' version '1.7.20-RC'
}

group 'org.example'
version '8.1'

repositories {
    mavenCentral()
}

dependencies {
    implementation fileTree('deps') { include '*.jar' }
    implementation 'org.jetbrains:annotations:20.1.0'
//    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
}
jar{
    baseName "vwSpaseShips"
}

test {
    useJUnitPlatform()
}
