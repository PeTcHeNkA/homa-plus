package protobuf;

option java_package = "plus.proto.lang";
option java_outer_classname = "TableData";

message Item {
  optional int32 id  = 1;
  optional string name = 2;
}

message BItem {
  optional int32 id  = 1;
  optional bytes data = 2;
}

message Data {
  //8 байт отступаем
  repeated BItem bdat = 3; //идет сначала, не смотря на то, что ID больше
  repeated Item item = 1;
}