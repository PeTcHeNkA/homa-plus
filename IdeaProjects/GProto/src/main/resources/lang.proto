package protobuf;

option java_package = "plus.proto.lang";
option java_outer_classname = "TableData";

message Item {
  optional int64 id  = 1;
  optional string name = 2;
}

message IndexItem {
  optional uint32 beginOff = 1;
  optional uint32 length   = 2;
}

message Index {
  optional uint32 dist = 1;
  optional bool  sect = 2;
  map<uint32, IndexItem> index = 3;
//  repeated IndexItem item = 3;
}

message Translations {
  repeated Item data = 1;
}

message TRef{
  required uint32 id = 1;
}

message UnknownGroup{
  repeated Unknown data = 1;
}

message Unknown{

}

