package protobuf;

option java_package = "plus.proto.lang";
option java_outer_classname = "TableData";

message Item {
  optional int64 id  = 1;
  optional string name = 2;
}

message IndexItem {
  optional uint32 beginOff = 1;
  optional uint32 length   = 2;
}

message Index {
  optional uint32 dist = 1;
  optional bool  sect = 2;
  map<int64, IndexItem> index = 3;
//  repeated IndexItem item = 3;
}

message Translations {
  repeated Item data = 1;
}

message TRef{
  required int64 id = 1;
}

message UnknownGroup{
  repeated Unknown data = 1;
}

message Unknown{

}

message ItemGetList{
  optional uint32 id = 1;
  optional uint32 type = 2;
  optional TRef title = 3;
  optional bool canJump = 4;
  optional string jumpC = 5;
  optional uint32 quickBye = 6;
}

message ItemGetListGroup{
  repeated ItemGetList data = 1;
}

message AvgContent{
  optional uint32 id = 1;
  optional TRef data1 = 2;
  optional TRef data2 = 3;
}

message AvgContentGroup{
  repeated AvgContent data = 1;
}

message VideoSubtitle{
  optional uint32 id = 1;
  optional TRef data = 2;
}

message VideoSubtitleGroup{
  repeated VideoSubtitle data = 1;
}

message ClothesU2{
  repeated ClotheUItem item = 1;
}

message IntList{
  repeated int32 num = 1;
}

message ClotheUItem{
  optional int32 id = 1;
  optional int32 l2 = 2;
  optional int32 l3 = 3;
  optional int32 l4 = 4;
  optional int32 modelId = 5;

  optional bytes l6 = 6;
  optional string gunCode = 7;
