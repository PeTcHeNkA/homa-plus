<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <script src="./reanet.js"></script>
    <link rel="stylesheet" href="./stdboost.css">
</head>

<body>

    <style>
        :root{
            --lgnc1n: rgb(170, 170, 170);
            --lgnc1h: rgb(159, 181, 181);
            --lgnc1a: rgb(60, 226, 255);
            
            --lgin1n: rgb(242, 242, 242);
            --lgin1a: white;

            --lglb1n: rgb(159, 181, 181);
            --lglb1h: rgb(207, 219, 219);

        }
        .login-form{
            width: 18em;

            margin: 10%;

            --color1: rgb(255, 69, 94);
            --color2: black;
            --color3: rgba(35, 35, 35, 0.392);
            --color4: rgba(255, 85, 113, 0.859);
            --color5: rgba(213, 77, 99, 0.752);
            --color-f: #FFFFE0;

            color: var(--color-f);

            font-size: 150%;
            
            font-family: "Exo", sans-serif;
            /* background-color: var(--color3) */
        }
        .login-form-lbl{
            background-color: var(--color3);
            cursor: default;
        }


        .login-form-inp{
            border: unset;
            background-color: var(--lgin1n);
        }
        .login-form-inp:focus{
            outline: none;
            background-color: var(--lgin1a);
        }
        .login-form-i-line{
            width: 100%;
            background-color: var(--color1);
            height: calc(var(--fct)/2)
        }
        .login-form-i-msg{
            color: var(--color1);
            background-color: var(--color3);
            /* margin-left: calc(var(--fct)*3); */
        }

        .login-form-tgb{
            opacity: 0.7;
            transition: 0.2s;
        }
        .login-form-tgb:hover{
            opacity: 1;
        }
        .login-form-ctn{
            overflow-y: auto;
            height: 100vh;
            background-image: url(./assets/img/bgparts/space-all.png)
        }
    </style>


    <style>
        .mmenu-item{
            overflow: hidden;
            --varsize: 100%;
            --varsize2: 0%;
            background-color: var(--color3);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-direction: column;
            min-width: 15%;
            padding: 0 2%;
            transition: 0.3s;
            cursor: pointer;
        }
        .mmenu-item:hover{
            --varsize: 110%;
            --varsize2: 130%;
            background-color: var(--color5);
        }
        .mmenu-item:active{
            transition: 0.07s;
            background-color: var(--color4)
        }
        .mmenu-item-inn{
            height: 100%;
            align-items: center;
            display: flex;
            transition: inherit;
            color: var(--color-f);
            transform: scale(var(--varsize));
        }
        .mmenu-item-line{
            height: 2px;
            width: var(--varsize2);
            transition: inherit;
            background-color: var(--color2);
        }
        .mmenu-line{
            height: 2px;
            width: 100%;
            background-color: var(--color1);
        }

        .bg-ico-std0{
            background-repeat: no-repeat;
			background-size: cover;
			background-position: 50%;
            will-change: transform;
        }
    </style>

    <template name="login">

    <script inc>
        let prevLogin, prevResult, cryptokey = "", flag = false, prvN, prvR;
        const _nickMsg = "_nickMsg", _mlMsg = "_mlMsg"
        let _V=(a,e)=>{getEl(a).style.display=e?"none":"block"};

        function inputMailCode(){
            reanet.lock().set("_lgcfm",true).unlock().set("_loginBtn", reanet.model["_loginmode"]==2?"Обновить":"Создать аккаунт")
        }

        function getGoTo(){
            let urlParams = new URLSearchParams(window.location.search);
            let goto = urlParams.get('goto');
            if(goto==""||goto==null)return "/";
            
            function ofMini(link){
                console.log(link);
                if(link==null || link=="")return null;
                function ofMin0(raw){
                    return raw.replaceAll("->","/").replaceAll("-e>","=")
                            .replaceAll("-q>","?").replaceAll("-n>","&");
                }
                switch (link.charAt(0)) {
                    case 'H':return "https://" + ofMin0(link.substring(1));
                    case 'S':return "/";
                    case 'I':return '/'+ ofMin0(link.substring(1));
                    default:return "http://" + ofMin0(link);
                };
            }
            return ofMini(goto);
        }

        function sendMail(){
            let exist = reanet.model["_loginmode"] == 2
            let login = getLoginM(exist);
            if(!login)return;
            let password = _validPsw();
            if(!password)return;
            let nick = getNameM(exist)
            if(!nick)return
            
            post("/auth/api/mail-"+(exist?"restore":"newuser"), login+";"+nick+";"+password+";"+cryptokey,(answ)=>{
                if(answ.startsWith("ERROR")){
                    let code = answ.split(" ")[1];
                    if(code == "NO_CAP4A"){
                        cryptokey = "";
                        _showCap4a();
                    } else if(code == "READY_EXIST_NAME"){
                        //TODO
                    }
                    console.log(code);
                } else{
                    inputMailCode();
                }
            });
        }
        function _isValidLogin0 (login){
            return /[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/.test(login)?login:false;
        }
        function _isValidPsw0 (psw){
            return /^(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z])(?=.*[!#$%?@-_+=^:;.<>*])(?=\S+$).{8,24}$/.test(psw)?psw:false;
        }
        function _validNick0 (nick){
            return (nick.length>3 && nick.length < 16 && /^\w+$/.test(nick))?nick:false
        }

        function getLoginM(exist=true){
            let valid = _isValidLogin()
            if(!valid)return valid
            if(_existLogin(valid)){
                if(!exist){
                    reanet.set(_mlMsg,"Аккаунт уже зарегистрирован")
                    return false
                }
            } else {
                if(exist){
                    reanet.set(_mlMsg,"Аккаунт не найден")
                    return false
                }
            }
            return valid
        }
        function getNameM(exist=true){
            let valid = _isValidNick()
            if(!valid)return valid
            if(_existName(valid)){
                if(!exist){
                    reanet.set(_nickMsg, "Никнейм уже занят")
                    return false
                }
            }
            return valid
        }

        window._isValidLogin = ()=>{
            let el = getEl("_lg-mail")
            if(!el || !el.value)return true
            let res = _isValidLogin0(el.value)
            if(!res){
                reanet.model[_mlMsg] = "Некорректный адрес почты!"
            }
            return res
        }
        window._isValidNick = ()=>{
            let el = getEl("_lg-nick")
            if(!el || !el.value)return true
            let nick = el.value
            let valid = _validNick0(nick)

            let setMsg = (msg)=>{
                reanet.model[_nickMsg] = msg
            }

            if(valid){
                return valid
            }
            if(nick.length<4){
                setMsg("Минимальная длина никнейма - 4 символа!")
            } else if(nick.length>15){
                setMsg("Максимальная длина никнейма - 15 символов!")
            } else {
                setMsg("Никнейм содержит недопустимые символы!")
            }
            return false
        }
        window._validPsw = ()=>{
            let el = getEl("_lg-psw")
            if(!el || !el.value)return true
            let psw = el.value
            let valid = _isValidPsw0(psw)
            if(valid)return valid
            let setMsg = (msg)=>{
                reanet.model["_pswMsg"] = msg
            }
            if(psw.length<8){
                setMsg("Минимальная длина - 8 символов!");
            } else if(psw.length>24){
                setMsg("Максимальная длина - 24 символа!");
            } else if(!/(?=.*[0-9])/.test(psw)){
                setMsg("Пароль должен содержать не менее 1 цифры!");
            } else if(!/(?=.*[a-z])/.test(psw)){
                setMsg("Пароль должен содержать не менее 1 прописной буквы!");
            } else if(!/(?=.*[A-Z])/.test(psw)){
                setMsg("Пароль должен содержать не менее 1 заглавной буквы!");
            } else {
                setMsg("Пароль содержит недопустимые символы! ");
            }
            return false
        }
        window._isValidDoublePsw = (strong=false)=>{
            let el = getEl("_lg-psw")
            if(!el)return true
            let val2 = getEl("_lg-psw-db").value
            if(!val2)return !strong
            return el.value == val2
        }
        window._setLgnMode = (mode)=>{
            let msg, hdr
            let tg1 = "Восстановление"
            let tg2 = "Регистрация"
            let tg3 = "Авторизация"
            let th1 = "пароль"
            if(mode==0){
                msg = "Войти"
                hdr = tg3
            } if(mode==1){
                msg = "Создать аккаунт"
                hdr = tg2
                tg2 = tg3
            } else if(mode==2){
                msg = "Сбросить пароль"
                hdr = tg1
                tg1 = tg3
                th1 = "новый пароль"
            }
            reanet.model["_loginmode"] = mode
            reanet.model["_loginBtn"]  = msg
            reanet.model["_loginHdr"]  = hdr
            reanet.model["_loginBf1"]  = tg1
            reanet.model["_loginBf2"]  = tg2
            reanet.model["_pswph"]     = th1
        }
        window._toggleMode = (left)=>{
            let mode = reanet.model["_loginmode"]
            reanet.model["_wgPsw"] = false
            if(mode==0){
                _setLgnMode(left?2:1)
            } else if(mode==1){
                _setLgnMode(left?2:0) 
            } else if(mode==2){
                _setLgnMode(left?0:1)
            }
            reanet.update()
        }
        window._getCap4a = (login=getEl("_lg-mail").value)=>{
            get("/auth/?cap4a-mtd=html&login="+login, (data)=>{
                getEl("_cap4a").innerHTML = data;
            });
            getEl("_cap4a_answer").value = "";
            getEl("_cap4a_module").style.visibility="visible";
            _V("_cap4a_view",false);_V("_cap4a_view_success",true);
        }
        window._showCap4a = (s=false)=>{

            if(cryptokey == ""){
                let login = _isValidLogin()
                if(!login || login==true)return;
                flag = true;
                _getCap4a(login);
                _V("_cap4a_view",s);_V("_cap4a_view_success",!s);
            } else{
                flag = true;
                _V("_cap4a_view",!s);_V("_cap4a_view_success",!s);
            }
        }
        
        function _existLogin(login){
            if(prevLogin==login && prevResult){
                return prevResult;
            }
            prevLogin = login;
            let res = syncGet("/auth/check_mail?login="+login+"&crypt-key="+cryptokey);
            if(res=="TRUE")prevResult = true;
            else if(res=="FALSE")prevResult = false;
            else{ 
                prevResult = prevLogin = null;
                console.log(res);
                let code = res.split(" ")[1];
                if(code=="NO_CAP4A" || code=="INVALID_KEY"){
                    _getCap4a();
                }
            }
            return prevResult;
        }
        
        function _existName(nick){
            if(prvN==nick)return prvR
            prvN = nick
            let res = syncGet("/auth/chick_name?name="+nick+"&crypt-key="+cryptokey);
            if(res=="TRUE")prvR = true;
            else if(res=="FALSE")prvR = false;
            else{ 
                prvN = prvR = null;
                console.log(res);
                let code = res.split(" ")[1];
                if(code=="NO_CAP4A" || code=="INVALID_KEY"){
                    _getCap4a();
                }
            }
            return prvR;
        }

        window._checkCap4a =()=>{
            let answer = getEl("_cap4a_answer").value;
            let cap4aid = getEl("cap4aid").innerHTML;
            get("/auth/?cap4a-mtd=answer&login="+getEl("_lg-mail").value+"&cap4a-id="+cap4aid+"&cap4a-answer="+answer,(data)=>{
                if(data.startsWith("ERROR")){
                    let code = data.split(" ")[1];
                    if(code=="NO_CAP4A"){
                        _getCap4a();
                    }
                    return;
                }
                cryptokey = data;
                console.log("KEY: "+cryptokey);
                _V("_cap4a_view",true);_V("_cap4a_view_success",false);
                if(reanet.model["_loginmode"]==2){
                    getEl("_lg-psw").style.display="inline-block";
                }
            });
        }
        window._onLoginClick =()=>{
            let curMode = reanet.model["_loginmode"]
            console.log(curMode);
            if(reanet.model["_lgcfm"]){
                if(curMode==1 || curMode==2){
                    let login = getEl("_lg-mail").value
                    let key = getEl("_lg-cfm").value;
                    get("/auth/confirm_"+(curMode==1?"create":"update")+"?api=1&login="+login+"&crypt-key="+key,(res)=>{
                        if(res.startsWith("SUCCESS")){
                            window.location = getGoTo();
                        } else {
                            reanet.model["_lgcfm"] = false
                            // let code = data.split(" ")[1];
                            // if(code=="NO_CAP4A"){
                            //     _getCap4a();
                            //     return
                            // }
                        }
                        console.log(res);
                    })
                }
            } else {
                if(cryptokey == ""){
                    if(!flag){
                        _showCap4a();
                    } else{
                        let login = getLoginM(curMode==1);
                        if(login)getCap4a(login);
                    }
                    return;
                } else{
                    if(curMode==1 || curMode==2){
                        sendMail();
                    }
                    if(curMode==0){
                        auth();
                    }
                }
            }
        }

        function auth(){
            let login = getLoginM(true);
            if(!login)return;
            let password = getEl("_lg-psw").value
            if(!password)return; 
            post("/auth/api/login", login+";"+password+";"+cryptokey,(answ)=>{
                //reanet.model["_pswMsg"] = msg
                if(answ.startsWith("ERROR")){
                    let code = answ.split(" ")[1];
                    if(code == "NO_CAP4A"){
                        cryptokey = "";
                        _showCap4a();
                    } else if(code == "WRONG_PASSWORD"){
                        reanet.lock().set("_wgPsw",true).unlock().set("_pswMsg", "Неправильный пароль")
                        //setMsg("Неправильный пароль",false);
                    }
                    console.log(answ);
                } else{
                    setTimeout(()=>{window.location = getGoTo()},200);
                }
            });
        }


    </script>


        <div class="flex-cm login-form overflow-h">
            <div class="flex mmenu-line"></div>
            <div class="flex w100 p3 login-form-lbl f3">{_loginHdr}</div>
            <div class="flex-cm m2">
                <input id="_lg-mail" class="p2 login-form-inp" type="email" 
                    placeholder="почта" autocomplete="email" onblur="reanet.model['_mlMsg']='';reanet.update()">
                <div r:if='!_isValidLogin()||reanet.model["_mlMsg"]'>
                    <div class="login-form-i-line"></div>
                    <div class="login-form-i-msg flex-start p2 f1">{_mlMsg}</div>
                </div>
            </div>
            <div r:if='reanet.model["_loginmode"] != 0' class="flex-cm m2">
                <input id="_lg-nick" class="p2 login-form-inp" type="nickname" 
                    placeholder="никнейм" autocomplete="nickname" onblur="reanet.update()">
                <div r:if='!_isValidNick()||reanet.model["_nickMsg"]'>
                    <div class="login-form-i-line"></div>
                    <div class="login-form-i-msg flex-start p2 f1">{_nickMsg}</div>
                </div>
            </div>
            <div class="login-form-i flex-cm m2">
                <div id="_pswc" class="flex">
                    <input id="_lg-psw" class="p2 login-form-inp w-100" type="password" 
                    placeholder="{_pswph}" autocomplete="new-password" onblur="reanet.update()">
                </div>
                <div r:if='!_validPsw() || reanet.model["_wgPsw"]'>
                    <div class="login-form-i-line"></div>
                    <div class="login-form-i-msg flex-start p2 f1">{_pswMsg}</div>
                </div>
            </div>
            <div r:if='reanet.model["_loginmode"] != 0' class="login-form-i flex-cm m2">
                <div id="_pswc" class="flex">
                    <input id="_lg-psw-db" class="p2 login-form-inp w-100" type="password" 
                        placeholder="повторите пароль" autocomplete="new-password" onblur="reanet.update()">
                </div>
                <div r:if="!_isValidDoublePsw()">
                    <div class="login-form-i-line"></div>
                    <div class="login-form-i-msg flex-start p2 f1">Пароли не совпадают!</div>
                </div>
            </div>
            <div id="_cap4a_module" class="m2">
                <div id="_cap4a_view" class="flex-cm w-100" style="display: none"> 
                    <div class="flex p2 login-form-lbl">Проверка на бота</div>
                    <div id="cap4a_content" class="flex-cm">
                        <div class="p2 noselect"><div id="_cap4a" class="p2 cap-cont"></div></div>
                        <input id="_cap4a_answer" class="p2 login-form-inp" type="text" placeholder="Перепечатайте код выше" autocomplete="off">
                        
                        <div class="flex p2 login-form-brn" onclick="_checkCap4a()">Проверить код</div>
                    </div>
                </div>
                <div id="_cap4a_view_success" class="flex p2 noselect" style="display: none">Проверка пройдена</div>
            </div>
            
            <div r:if='reanet.model["_lgcfm"]' class="flex-cm m2">
                <input id="_lg-cfm" class="p2 login-form-inp" type="text" 
                    placeholder="код подтверждения из почты" autocomplete="off" onblur="_updateLoginForm()">
                <div r:if='!_isValidNick()'>
                    <div class="login-form-i-line"></div>
                    <div class="login-form-i-msg flex-start p2 f1">{_lgcfmmsg}</div>
                </div>
            </div>

            <div class="flex f1 m2h noselect w-100">
                <div onclick="_toggleMode(true)" class="mmenu-item w-100">
                    <div class="mmenu-item-inn p1">{_loginBf1}</div>
                    <div class="mmenu-item-line"></div>
                </div>
                <div onclick="_toggleMode(false)" class="mmenu-item w-100">
                    <div class="mmenu-item-inn p1">{_loginBf2}</div>
                    <div class="mmenu-item-line"></div>
                </div>
            </div>
            <div class="flex w100 p3 mmenu-item f3 noselect" onclick="_onLoginClick()">
                <div class="mmenu-item-inn p1">{_loginBtn}</div>
                <div class="mmenu-item-line"></div>
            </div>
        </div>
    </template>

    <div class="w-100 bg-ico-std0 login-form-ctn">
        <div class="flex w-100" id="frame"></div>
    </div>

    <script src="./modules/sl_rloader.js"></script>

    <script>
        let data = {
            type2: "password"
        }
        reanet.model = data
        _setLgnMode(0)
        reanet.placeTo("frame", "login")
    </script>

</body>
</html>
