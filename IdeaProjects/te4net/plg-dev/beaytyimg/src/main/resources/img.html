%func:check-b-args%
<html>
	<head>
		<meta charset="UTF-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta property="og:url" content="%host%">
		<meta property="og:title" content='%q:title/"Архив техника"%'>
		<meta property="og:description" content="Фото: %q:name/splat:0%">
		<meta property="og:image" content="/assets/img/%splat:0%">
		<meta property="twitter:image" content="/assets/img/%splat:0%">
		<meta property="og:site_name" content="te4hnoplus">
		%func:inc-vid/"<meta property='og:type' content='article'><meta name='twitter:card' content='summary_large_image'>"%
		<title>BeautyImg -> %q:name/splat:0%</title>

		<style>
			:root {
				--sh-col: rgba(25, 27, 30, 0.7);
			}

			body {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
				height: 100%;
			}

			.mg {
				background-repeat: no-repeat;
				background-size: cover;
				background-position: 50%;
				width: 100vw;
				height: 100vh;
				box-shadow: 0px 0px 70px 0px var(--sh-col) inset
			}

			.bga {
				width: 100%;
				height: 100%;
				background-color: rgba(38, 40, 49, 0.794);
			}

			.cg {
				backdrop-filter: blur(4px);
				width: 100%;
				height: 100%;
				overflow: auto
			}

			.cgi {
				border-radius: 4px;
				box-shadow: 0px 0px 70px 0px var(--sh-col);
				/* width: 100%; */
			}

			.dl {
				position: sticky;
				width: 100%;
				top: 1%;
			}

			.dla {
				background: linear-gradient(225deg, rgba(62, 62, 62, 0.75), rgba(0, 0, 0, 0.75));
				border-radius: 0.5vh;
				opacity: 0.5;
				transition: 0.3s;

				position: absolute;
				right: 5%;
				font-size: 7vh;
				padding: 1vh;
				padding-left: 4vh;
				padding-right: 4vh;
				user-select: none;
				color: rgb(236, 236, 236);
			}

			.dla:hover {
				color: white;
				opacity: 0.75;
			}

			.eb {
				margin-top: 1%;
				margin-bottom: 1%;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			.ea {
				min-width: auto;
				margin: 0;
			}

			@media screen and (max-width: 1000px) {
				.eb {
					margin-top: 0;
					width: 100%;
				}

				.ea {
					min-width: 90%;
					margin: 5%;
				}

				.dl {
					display: flex;
					align-items: center;
					justify-content: center;
				}

				.dla {
					right: inherit;
					margin-top: 7%;
				}
				.cgi{
					width: 100%;
				}
			}
		</style>
	</head>

	<body>
		<reactive>
			<div class="mg" style="background-image: url('/assets/img/%splat:0%')">
				<div class="bga">
					<div class="cg">
						<div class="dl">
							<a class="dla" href="/assets/img/%splat:0%?size=0&dl=true" download>СКАЧАТЬ</a>
						</div>
						<div class="eb">
							<img class="cgi" src="/assets/img/%splat:0%" alt="">
						</div>
					</div>
				</div>
			</div>
		</reactive>
	</body>

</html>
