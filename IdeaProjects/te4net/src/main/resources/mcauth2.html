<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./reanet.js"></script>
    <link rel="stylesheet" href="./stdboost.css">
</head>

<body>

    <style>
        :root{
            --lgnc1n: rgb(170, 170, 170);
            --lgnc1h: rgb(159, 181, 181);
            --lgnc1a: rgb(60, 226, 255);
            
            --lgin1n: rgb(242, 242, 242);
            --lgin1a: white;

            --lglb1n: rgb(159, 181, 181);
            --lglb1h: rgb(207, 219, 219);

            --erc: brown;
        }
        .login-form{
            width: 18em;
            background-color: lightgray;
        }
        .login-form-inp{
            border: unset;
            background-color: var(--lgin1n);
        }
        .login-form-inp:focus{
            outline: none;
            background-color: var(--lgin1a);
        }
        .login-form-i-line{
            width: 100%;
            background-color: var(--erc);
            height: calc(var(--fct)/2)
        }
        .login-form-i-msg{
            color: var(--erc);
            margin-left: calc(var(--fct)*3);
        }
        .login-form-brn{
            background-color: var(--lgnc1n);
            transition: 0.17s;
            user-select: none;
        }
        .login-form-brn:hover{
            background-color: var(--lgnc1h);
        }
        .login-form-brn:active{
            background-color: var(--lgnc1a);
        }

        .login-form-lbl{
            background-color: var(--lglb1n);
            transition: 0.17s;
            user-select: none;
        }
        .login-form-lbl:hover{
            background-color: var(--lglb1h);
        }


        .login-form-tgb{
            opacity: 0.7;
            transition: 0.2s;
        }
        .login-form-tgb:hover{
            opacity: 1;
        }
    </style>

    <template name="login">
        <script inc>
            let prevLogin, prevResult, cfmMode, cryptokey
            let _V=(a,e)=>{getEl(a).style.display=e?"none":"block"};

            function sendMail(){
                let exist = reanet.model["_loginmode"] == 2

                let login = getLoginM(exist);
                if(!login)return;
                let password = _validPsw();
                if(!password)return;                    
                post("/auth/api/mail-"+(exist?"restore":"newuser"), login+";"+password+";"+cryptokey,(answ)=>{
                    if(answ.startsWith("ERROR")){
                        let code = answ.split(" ")[1];
                        if(code == "NO_CAP4A"){
                            cryptokey = "";
                            showCap4a();
                        }
                        console.log(code);
                    } else{
                        inputMailCode();
                    }
                    });
                }
            function _isValidLogin0 (login){
                return /[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/.test(login)?login:false;
            }
            function _isValidPsw0 (psw){
                return /^(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z])(?=.*[!#$%?@-_+=^:;.<>*])(?=\S+$).{8,24}$/.test(psw)?psw:false;
            }
            function _validNick0 (nick){
                return (nick.length>3 && nick.length < 16 && /^\w+$/.test(nick))?nick:false
            }

            function getLoginM(exist=true){
                let valid = _isValidLogin()
                if(_existLogin(valid)){
                    if(!exist){
                        setMsg("Аккаунт не найден")
                        return false
                    }
                } else {
                    if(exist){
                        setMsg("Аккаунт уже зарегистрирован")
                        return false
                    }
                }
                return valid
            }

            window._fix = (el)=>{
                el = getEl(el)
                el.innerHTML = el.innerHTML
            }
            window._updateLoginForm = ()=>{
                reanet.update()
            }
            window._isValidLogin = ()=>{
                let el = getEl("_lg-mail")
                if(!el || !el.value)return true
                return _isValidLogin0(el.value)
            }
            window._isValidNick = ()=>{
                let el = getEl("_lg-nick")
                if(!el || !el.value)return true
                let nick = el.value
                let valid = _validNick0(nick)

                let setMsg = (msg)=>{
                    reanet.model["_nickMsg"] = msg
                }

                if(valid){
                    return valid
                }
                if(nick.length<4){
                    setMsg("Минимальная длина никнейма - 4 символа!")
                } else if(nick.length>15){
                    setMsg("Максимальная длина никнейма - 15 символов!")
                } else {
                    setMsg("Никнейм содержит недопустимые символы!")
                }
                return false
            }
            window._validPsw = ()=>{
                let el = getEl("_lg-psw")
                if(!el || !el.value)return true
                let psw = el.value
                let valid = _isValidPsw0(psw)
                if(valid)return valid
                let setMsg = (msg)=>{
                    reanet.model["_pswMsg"] = msg
                }
                if(psw.length<8){
                    setMsg("Минимальная длина - 8 символов!");
                } else if(psw.length>24){
                    setMsg("Минимальная длина - 24 символа!");
                } else if(!/(?=.*[0-9])/.test(psw)){
                    setMsg("Пароль должен содержать не менее 1 цифры!");
                } else if(!/(?=.*[a-z])/.test(psw)){
                    setMsg("Пароль должен содержать не менее 1 прописной буквы!");
                } else if(!/(?=.*[A-Z])/.test(psw)){
                    setMsg("Пароль должен содержать не менее 1 заглавной буквы!");
                } else {
                    setMsg("Пароль содержит недопустимые символы! ");
                }
                return false
            }
            window._isValidDoublePsw = (strong=false)=>{
                let el = getEl("_lg-psw")
                if(!el)return true
                let val2 = getEl("_lg-psw-db").value
                if(!val2)return !strong
                return el.value == val2
            }
            window._setLgnMode = (mode)=>{
                let msg, hdr
                let tg1 = "Восстановление"
                let tg2 = "Регистрация"
                let tg3 = "Авторизация"
                if(mode==0){
                    msg = "Войти"
                    hdr = tg3
                } if(mode==1){
                    msg = "Создать аккаунт"
                    hdr = tg2
                    tg2 = tg3
                } else if(mode==2){
                    msg = "Сбросить пароль"
                    hdr = tg1
                    tg1 = tg3
                }
                reanet.model["_loginmode"] = mode
                reanet.model["_loginBtn"]  = msg
                reanet.model["_loginHdr"]  = hdr
                reanet.model["_loginBf1"]  = tg1
                reanet.model["_loginBf2"]  = tg2
            }
            window._toggleMode = (left)=>{
                let mode = reanet.model["_loginmode"]
                if(mode==0){
                    _setLgnMode(left?2:1)
                } else if(mode==1){
                    _setLgnMode(left?2:0) 
                } else if(mode==2){
                    _setLgnMode(left?0:1)
                }
                reanet.update()
            }
            window._getCap4a = (login=getEl("_lg-mail").value)=>{
                get("/auth/?cap4a-mtd=html&login="+login, (data)=>{
                    getEl("_cap4a").innerHTML = data;
                });
                getEl("_cap4a_answer").value = "";
                getEl("_cap4a_module").style.visibility="visible";
                _V("_cap4a_view",false);_V("_cap4a_view_success",true);
            }
            window._showCap4a = (s=false)=>{
                if(flag)return;
                if(cryptokey == ""){
                    let login = _isValidLogin()
                    if(!login || login==true)return;
                    flag = true;
                    _getCap4a(login);
                    _V("cap4a_view",s);_V("cap4a_view_success",!s);
                } else{
                    flag = true;
                    _V("cap4a_view",!s);_V("cap4a_view_success",!s);
                }
            }
            window._existLogin = (login)=>{
                return false
                if(prevLogin==login && prevResult){
                    return prevResult;
                }
                prevLogin = login;
                let res = syncGet("/auth/check_mail?login="+login+"&crypt-key="+cryptokey);
                if(res=="TRUE")prevResult = true;
                else if(res=="FALSE")prevResult = false;
                else{ 
                    prevResult = null;
                    console.log(res);
                }
                return prevResult;
            }
            window._checkCap4a =()=>{
                let answer = getEl("_cap4a_answer").value;
                let cap4aid = getEl("cap4aid").innerHTML;
                get("/auth/?cap4a-mtd=answer&login="+$T("login").value+"&cap4a-id="+cap4aid+"&cap4a-answer="+answer,(data)=>{
                    if(data.startsWith("ERROR")){
                        let code = data.split(" ")[1];
                        if(code=="NO_CAP4A"){
                            _getCap4a();
                        }
                        return;
                    }
                    cryptokey = data;
                    console.log("KEY: "+cryptokey);
                    _V("_cap4a_view",true);_V("_cap4a_view_success",false);
                    if(curMode==2){
                        getEl("password").style.display="inline-block";
                    }
                });
            }
            window._onLoginClick =()=>{
                let curMode = reanet.model["_loginmode"]
                if(cfmMode){
                    if(curMode==0 || curMode==2){
                        let login = getLogin();
                        let key = $T("login_btn_code").value;
                        get("/auth/confirm_"+(curMode==0?"create":"update")+"?api=1&login="+login+"&crypt-key="+key,(res)=>{
                            if(res.startsWith("SUCCESS")){
                                window.location = getGoTo();
                            }
                        })
                    }
                } else {
                    if(cryptokey == ""){
                        if(!flag){
                            showCap4a();
                        } else{
                            let login = getLoginM();
                            if(login)getCap4a(login);
                        }
                        return;
                    } else{
                        if(curMode==0 || curMode==2){
                            sendMail();
                        }
                        if(curMode==1){
                            auth();
                        }
                    }
                }
            }
        
        
        </script>
        <script inc on="place">
            _fix("_pswc")
        </script>
        <div class="flex-cm login-form overflow-h br3">
            <div class="flex w100 p3 login-form-lbl f3">{_loginHdr}</div>
            <div class="flex-cm m2">
                <input id="_lg-mail" class="p2 login-form-inp" type="email" 
                    placeholder="почта" autocomplete="email" onblur="_updateLoginForm()">
                <div if='!_isValidLogin()'>
                    <div class="login-form-i-line"></div>
                    <div class="login-form-i-msg flex-start m1 f1">Некорректный адрес почты!</div>
                </div>
            </div>
            <div if='reanet.model["_loginmode"] != 0' class="flex-cm m2">
                <input id="_lg-nick" class="p2 login-form-inp" type="nickname" 
                    placeholder="никнейм" autocomplete="nickname" onblur="_updateLoginForm()">
                <div if='!_isValidNick()'>
                    <div class="login-form-i-line"></div>
                    <div class="login-form-i-msg flex-start m1 f1">{_nickMsg}</div>
                </div>
            </div>
            <div if='reanet.model["_loginmode"] != 2' class="login-form-i flex-cm m2">
                <div id="_pswc" class="flex">
                    <input id="_lg-psw" class="p2 login-form-inp w-100" type="password" 
                    placeholder="пароль" autocomplete="new-password" onblur="_updateLoginForm()">
                </div>
                <div if="!_validPsw()">
                    <div class="login-form-i-line"></div>
                    <div class="login-form-i-msg flex-start m1 f1">{_pswMsg}</div>
                </div>
            </div>
            <div if='reanet.model["_loginmode"] == 1' class="login-form-i flex-cm m2">
                <div id="_pswc" class="flex">
                    <input id="_lg-psw-db" class="p2 login-form-inp w-100" type="password" 
                        placeholder="повторите пароль" autocomplete="new-password" onblur="_updateLoginForm()">
                </div>
                <div if="!_isValidDoublePsw()">
                    <div class="login-form-i-line"></div>
                    <div class="login-form-i-msg flex-start m1 f1">Пароли не совпадают!</div>
                </div>
            </div>
            <div id="_cap4a_module" class="m2">
                <div id="_cap4a_view" class="flex-cm w-100" style="display: none"> 
                    <div class="flex p2 login-form-lbl">Проверка на бота</div>
                    <div id="cap4a_content" class="flex-cm">
                        <div class="p2"><div id="cap4a" class="cap4a_cap4a noselect"></div></div>
                        <input id="_cap4a_answer" class="p2 login-form-inp" type="text" placeholder="Перепечатайте код выше" autocomplete="off">
                        
                        <div class="flex p2 login-form-brn" onclick="checkCap4a()">Проверить код</div>
                    </div>
                </div>
                <div id="_cap4a_view_success" class="flex p2 noselect" style="display: none">Проверка пройдена</div>
            </div>
            <div class="flex-around f1 m1 noselect">
                <div onclick="_toggleMode(true)" class="p2 br2 login-form-tgb">{_loginBf1}</div>
                <div onclick="_toggleMode(false)" class="p2 br2 login-form-tgb">{_loginBf2}</div>
            </div>
            <div class="flex w100 p3 login-form-brn f3" onclick="_onLoginClick()">
                {_loginBtn}
            </div>
        </div>
    </template>

    <div class="flex w-100 h-100" id="frame"></div>
    <script src="./modules/sl_rloader.js"></script>

    <script>
        let data = {
            type2: "password",
        }
        reanet.model = data
        _setLgnMode(0)
        reanet.placeTo("frame", "login")
    </script>


</body>
</html>
