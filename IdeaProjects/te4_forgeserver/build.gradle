import proguard.gradle.ProGuardTask

buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://plugins.gradle.org/m2" }
        maven { url = "https://repo.spongepowered.org/maven" }
        maven { url = "https://maven.minecraftforge.net/" }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle',
                version: '4.1.+', changing: true
        classpath "org.spongepowered:mixingradle:0.7-SNAPSHOT"

        classpath 'com.guardsquare:proguard-gradle:7.4.2'
        classpath 'com.github.gmazzo:gradle-buildconfig-plugin:3.0.0'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: "org.spongepowered.mixin"
apply plugin: 'com.github.gmazzo.buildconfig'

def name = 'elca_server'

version = "2.5.2.07"
group = "plus"
archivesBaseName = name
sourceCompatibility = targetCompatibility = 1.8
compileJava.options.encoding = compileTestJava.options.encoding = "UTF-8"

minecraft {
    mappings channel: 'stable', version: "39-1.12"

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            args "--tweakClass", "org.spongepowered.asm.launch.MixinTweaker",
                    '--tweakClass', 'plus.fserver.plugin.SSPatchLoader'
//                    '--mixin', 'mixins.fserver.json'
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            args "--tweakClass", "org.spongepowered.asm.launch.MixinTweaker",
                    '--tweakClass', 'plus.fserver.plugin.SSPatchLoader'

        }
    }
}

mixin {
    add sourceSets.main, "mixins.fserver.refmap.json"
}

task prepareAssets(type: Copy) {
    group = 'build'
    from project.file('src/main/resources')
    into project.file('build/classes/java/main')
}

repositories {
    mavenCentral()
    maven { url = "https://repo.spongepowered.org/maven" }
    flatDir { dirs 'lib' }
    flatDir {
        dirs "C:/Users/Te4hnoPlus/IdeaProjects/REPO/"
    }
}

dependencies {
    implementation 'plus:mergetoolfixed:0.2.3.3'

    minecraft "net.minecraftforge:forge:1.12.2-14.23.5.2859"
    implementation "org.spongepowered:mixin:0.8.3-SNAPSHOT"
    annotationProcessor 'org.spongepowered:mixin:0.8.3-SNAPSHOT:processor'

    implementation fileTree("lib")
}

buildConfig{
    className("ElcaCV2")
    packageName("plus.fserver")
    if(project.gradle.startParameter.taskNames.contains("buildLib")){
        buildConfigField('boolean', 'LIBBUILD', 'true')
    } else {
        buildConfigField('boolean', 'LIBBUILD', 'false')
    }
}

jar {
    exclude("org/intellij/**")
    exclude("org/jetbrains/**")
    exclude("com/google/errorprone/annotations/**")

    if(project.gradle.startParameter.taskNames.contains("buildLib")){
        archivesBaseName = "elca_lib"
        exclude("net/**")
        exclude("com/**")
        //exclude("plus/**")
        exclude("linux_aarch64/**")
        exclude("linux_x86_64/**")

        include("plus/fserver/api/**")
        include("plus/fserver/block/**")
        include("plus/fserver/event/**")

        include("plus/fserver/utls/collections/ArrayListE6.class")
        include("plus/fserver/utls/collections/ArrayListEV.class")
        include("plus/fserver/utls/collections/FixedItemList.class")
        include("plus.fserver.utls.collections.AABBList.class")

        include("plus/fserver/utls/WorldConstructor.class")
        include("plus/fserver/utls/McTsonUtils.class")
        include("plus/fserver/utls/TsonThreeRegistry.class")
    } else{
        manifest {
            attributes([
                    "Implementation-Title"    : "elca_fserver",
                    "Implementation-Version"  : project.version,
                    //"TweakClass": "org.spongepowered.asm.launch.MixinTweaker",
                    "TweakClass": "plus.fserver.plugin.SSPatchLoader",
//                "MixinConfigs": "mixins.te4_fserver.json",
                    "TweakOrder": "100",
                    "FMLCorePluginContainsFMLMod": "true",
                    "ForceLoadAsMod": "true",
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
            ])
        }

        from {
            configurations.runtimeClasspath.collect {
                if(it.name.equalsIgnoreCase("zstd-jni-1.5.5-9-universal.jar")) {
                    zipTree(it)
                }
            }
        }
    }
}

task buildLib{
    dependsOn jar
}

//jar.finalizedBy('reobfJar')

sourceSets {
    main {
        java {
            srcDir 'C:/Users/Te4hnoPlus/IdeaProjects/TsonConfigurations/core/src/main/java'
            srcDir 'C:/Users/Te4hnoPlus/IdeaProjects/TsonConfigurations/extensions/src/main/java'
            srcDir 'C:/Users/Te4hnoPlus/IdeaProjects/te4_async_utls/src/main/java'
            srcDir 'lib2/performant-1.12.2'
            srcDir 'lib2/phosphor-1.12.2-0.2.9.3'
        }
    }
}

//jar.finalizedBy('proguard')

tasks.register('proguard', ProGuardTask) {

    configuration file('proguard.pro')

    def proName = name + "-" + version

    injars 'build/libs/'+proName+'.jar'
    outjars 'build/libs/'+proName+'-pro.jar'

    libraryjars sourceSets.main.compileClasspath

    if (System.getProperty('java.version').startsWith('1.')) {
        libraryjars "${System.getProperty('java.home')}/lib/rt.jar"
    } else {
        libraryjars "${System.getProperty('java.home')}/jmods/java.base.jmod", jarfilter: '!**.jar', filter: '!module-info.class'
        libraryjars "${System.getProperty('java.home')}/jmods/java.sql.jmod", jarfilter: '!**.jar', filter: '!module-info.class'
    }

    doLast {
        file('build/libs/'+proName+'.jar').delete();
        file('build/libs/'+proName+'-pro.jar').renameTo('build/libs/'+proName+'.jar')
    }
}