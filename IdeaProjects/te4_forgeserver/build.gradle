import proguard.gradle.ProGuardTask

buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://plugins.gradle.org/m2" }
        maven { url = "https://repo.spongepowered.org/maven" }
        maven { url = "https://maven.minecraftforge.net/" }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle',
                version: '4.1.+', changing: true
        classpath "org.spongepowered:mixingradle:0.7-SNAPSHOT"

        classpath 'com.guardsquare:proguard-gradle:7.4.2'
    }
}

//plugins {
//    id 'com.github.johnrengelman.shadow' version '5.2.0'
//}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: "org.spongepowered.mixin"
//apply plugin: 'java-library'

def name = 'elca_server'

version = "2.7"
group = "plus"
archivesBaseName = name
sourceCompatibility = targetCompatibility = 1.8
compileJava.options.encoding = compileTestJava.options.encoding = "UTF-8"

minecraft {
    mappings channel: 'stable', version: "39-1.12"

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            args "--tweakClass", "org.spongepowered.asm.launch.MixinTweaker",
                    '--tweakClass', 'plus.fserver.plugin.SSPatchLoader'
//                    '--mixin', 'mixins.fserver.json'
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            args "--tweakClass", "org.spongepowered.asm.launch.MixinTweaker",
                    '--tweakClass', 'plus.fserver.plugin.SSPatchLoader'


//                    '--mixin', 'mixins.fserver.json'

            //te4_spships
        }
    }
}

mixin {
    add sourceSets.main, "mixins.fserver.refmap.json"
}

task prepareAssets(type: Copy) {
    group = 'build'
    from project.file('src/main/resources')
    into project.file('build/classes/java/main')
}
//
//processResources {
//    from(sourceSets.main.resources.srcDirs) {
//        include 'mcmod.info'
//    }
//    from(sourceSets.main.resources.srcDirs) {
//        exclude 'mcmod.info'
//    }
//}
//runClient.dependsOn(prepareAssets)
