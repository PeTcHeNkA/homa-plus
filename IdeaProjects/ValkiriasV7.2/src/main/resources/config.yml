classes:
    #ValkiriaShooter: "Стрелок"
    #ValkiriaSword:   "Самурай"

    ValkiriaShooter:
        name: "Стрелок"
        big_ico:
            cmd: 1009101
        small_ico:
            cmd: 1009103
        lore_item:
            cmd: 1009105
        weapon: "0;1;2;0;0;0;0;4;0;0;f"
        skill_normal:
            cmd: 1009002
            lore:
            - "Ловкий прием"
            - "Стрелок бросает под ноги гранату и резко отпрыгивает назад,"
            - "нанеся всем целям в радиусе 3-х блоков 225% урона"
        skill_hight:
            cmd: 1009001
            lore:
            - "Контратака"
            - "Стрелок переходит в наступление и выпускает мощный энергетический импульс,"
            - "который наносит 375% урона всем целям в радиусе 4-х блоков"
    ValkiriaSword:
        name: "Самурай"
        big_ico:
            cmd: 1009102
        small_ico:
            cmd: 1009104
        lore_item:
            cmd: 1009106
        weapon: "0;1;1;0;0;0;0;4;0;0;f"
        skill_normal:
            cmd: 1009002
            lore:
            - "Решительный натиск"
            - "Самурай собирается с мыслями и получает 5 очков стремительности. Максимум 7"
            - "При нанесении обычных атак расходуется 1 очко стремительности и повышается урон на 75%"
            - "При использовании заряженных атак расходуется 3 очка стремительности и урон повышается на 30%"
            - "Время отката: 4 секунды"
            - "Затраты энергии: 250"
        skill_hight:
            cmd: 1009001
            lore:
            - "Мастерство клинка"
            - "Самурай наносит серию решительных ударов в всем целям, в радиусе 3-х с половиной блоков и"
            - "Наносит им 375% урона"

