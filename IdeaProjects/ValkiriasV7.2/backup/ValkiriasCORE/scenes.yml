          m5=sleep: 2500
          m6=chat:
            message:
            - '- Ваша цель собрать разведданные, а затем любой ценой ликвидировать
              противника класса S[всплывашка]'
          m7=sleep: 2000
          m8=chat: '- До прибытия на орбиту планеты остался 1 день. Используйте это
            время с умом.'
          m9=sleep: 2500
          m10=chat: Командор сказала, что до прибытия осталось слишком мало времени.
          m11=sleep: 2500
          m12=chat: '    … Было бы неплохо обновить свои навыки боя.'
