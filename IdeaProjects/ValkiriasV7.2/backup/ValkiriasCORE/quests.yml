# 
#  start:
#    type: DIALOG или ITEM или CHOICE
#    uid: 1  это uid для сохранения квеста. если нет - квест не сохраняется и можно выполнить повторно.
#    take:
#      ==: org.bukkit.Location
#      world: world
#      x: 0.0
#      y: 0.0
#      z: 0.0
#      pitch: 0.0
#      yaw: 0.0
#    take_range: 10
#    interact_location:
#      ==: org.bukkit.Location
#      world: world
#      x: 0.0
#      y: 0.0
#      z: 0.0
#      pitch: 0.0
#      yaw: 0.0
#    interact_distance: 10 до этого места ничего не трогай, ибо это сгенерирует скрипт правильно
#    dialogs:
#      main: начало квеста всегда тут.
#        message: тут сообщения, модуля AdventureChat
#        - string_1
#        - string_2
#      info: тут дополнительный диалог, который можно вызвать командой /quest int [label]" дополнительные диалоги возможны только для DIALOG
#        message:
#        - string_1
#        - string_2
#    lore:
#    - string_1
#    - string_2
#    complate:
#        key: dialg9topsecretkey   только для типа DIALOG ключ, который завершает квест. 
#        message:        то что выполнения после квеста пишет
#        - "message AdventureChat"
#        exp: 10
#        need_item_in_hand:       только для типа ITEM (предмет)
#        need_item_in_hand_ct:    только для типа ITEM (количество предметов)
#        get_items: *id001        полученные предметы после выполнения
#    choises:
#    - help:start         только для CHOICE, перед ":" находится ключ-команда (/quest int help) а после имя нового квеста
#    next_quest: start    для всех типов, кроме CHOICE

quests:
  main_spawn:
    uid: 1
    dialogs:
      main:
        message:
        - '&fПриветствую тебя новобранец!+Хочешь разобраться как тут играть?Тогда
          приступим!+Здесь почти все сообщения имеют интерактивные подсказки.+'
        - '&e[Попробуй нажать на строку ниже]+'
        - '@HНиже семпай!'
        - '&2[Понятно.]'
        - '@H&2Да, Нажми на меня!'
        - '@C/quest int dialg2'
      dialg2:
        message:
        - '&fТы быстро учишься. Пришло время выбрать тебе &cкласс&f.+'
        - '&2[Открыть меню выборка]+'
        - '@C/valkirias chcl'
        - '&cКогда выберешь, сообщи мне и мы продолжим твое обучение.'
        - '&2[Я выбрал себе класс!]'
        - '@C/quest int dialg3'
      dialg3:
        message:
        - Отлично. Может быть ты не знал, но каждая валькирия намного сильнее обычных
          людей.+ У тебя так-же есть эта сила. Для начала активируй боевой режим.
        - '&c[?]'
        - '@HНажми клавишу F для активации боевого режима.'
        - '&2[Понятно]'
        - '@C/quest int dialg4'
        - ' '
        - '&c[Получить подсказку]'
        - '@C/quest int help_combat'
      help_combat:
        message:
        - '&fДля переключения режима боя используйте клавишу &c[F]+&fИли просто начните
          атаковать врага для автоматической активации+'
        - '&2[Понятно]'
        - '@C/quest int dialg4'
      dialg4:
        message:
        - '&fКогда вы находитесь в режиме боя, система valkirias перенастраивает ваше
          тело на максимальную боевую эффективность.+&fПока вы находитесь в данном
          режиме, вы не можете взаимодействовать с инвентарем и менять артефакты.'
        - '&2[Понятно]'
        - '@C/quest int dialg5'
      dialg5:
        message:
        - '&fОбратите внимание на 8 и 9-тый слоты вашего хотбара.'
        - '&fВ режиме боя вы можете активировать специальные навыки переключившись
          на нужный слот.'
        - '&cБудте осторожны при использовании навыков! Они требуют очень много '
        - '&2[энергии]'
        - '@HИконки батареек слева'
        - ' &fвашего тела, если она иссякнет, вы можете отключиться!+'
        - Восстоновить энергию можно в безопасном режиме отведав чего-нибудь вкусного
        - '&2[Понятно]'
        - '@C/quest int dialg6'
      dialg6:
        message:
        - '&fЧтобы предотвратить быструю смерть от различного рода опасностей, +которыми
          полон этот мир, система valkirias так-же оснащена '
        - '&2[энергетическим щитом].+'
        - '@H&fCветло-леленая шкала, прямо над вашим ХотБаром.+Цифры над ней - текущая
          емкость щита.'
        - ' который не даст вам получить урон, пока полностью не иссякнет.+'
        - '&2[Понятно]'
        - '@C/quest int dialg7'
      dialg7:
        message:
        - '&fОткройте ваш инвентарь. Слева от иконки вашего персонажа находятся 4
          кнопки:+'
        - '&c[Профиль]+'
        - '@HГлавная страница вашего профиля'
        - '&e[Оружие]+'
        - '@H&fПросмотр и смена вашего оружия. +Без выбранного оружия вы не сможете
          войти в режим боя!+&cНе теряется после смерти!'
        - '&d[Модули]+'
        - '@HПросмотр и смена модулей улучшения, которые увеличивают ваши боевые способности.+&cНе
          теряется после смерти!'
        - '&2[Облачное хранилище]++'
        - '@HНебольшая часть облака главного сервера valkirias, +который позволяет
          безопасно хранить любые предметы.+&cНе теряется после смерти!'
        - '&2[Понятно]'
        - '@C/quest int dialg8'
      dialg8:
        message:
        - '&fПерейдем к вашей индвидиуализации. В настройках профиля, как вы могли
          заменить, находится ваша аватарка, +которая видна всем пользователям. Вы
          можете выбрать себе другую аватарку из доступных по подсказке ниже+'
        - '&2[/avatar page <группа> <страница>]+'
        - '@S/avatar page default 0'
        - '&2[/avatar set <группа> <номер>]+'
        - '@S/avatar set default 0'
        - '&fВ меню просмотра аватарок, для удобства, так-же включены &2подсказки&f.'
        - '&f[Напишите любое сообщение в чат и наведите курсор мыши на ваш ник-нейм]+'
        - '@C!Привет всем!'
        - '&2[Понятно]'
        - '@C/quest int dialg9topsecretkey'
    lore:
    - '&c[Обучение] &fнайдите '
    - '&cвалькирию'
    - '@H&fКрасивая девушка в космической броне у входа в Алькор'
    - ' у главного входа в '
    - '&c[Алькор] '
    - '@HНазвание космического корабля в котором вы прилетели сюда+&cКоординаты:&f
      -550 70 320'
    - и поговорите с ней.
    next_quest: none
    complate:
      key: dialg9topsecretkey
      message:
      - '&fОбучение завершено. Удачной игры на Valkirias Warfare!'
      exp: 10
    interact_location:
      ==: org.bukkit.Location
      world: world
      x: -544.6993235041741
      y: 68.0
      z: 313.4913836606587
      pitch: 81.80959
      yaw: 268.18515
    interact_distance: 5
    take:
      is_cub_area: false
      range: 10
    take_range: 10
  trable_connect1:
    dialogs:
      main:
        message: &id004
        - String_1
        - String_2
    lore: *id004
    complate:
      message: *id004
      exp: 10
      get_items: *id004
    next_quest: none
    interact_location:
      ==: org.bukkit.Location
      world: world
      x: -445.5131718011192
      y: 66.0
      z: 169.49833682438145
      pitch: 90.0
      yaw: 10.444329
    interact_distance: 5
    take:
      ==: org.bukkit.Location
      world: world
      x: -445.5131718011192
      y: 66.0
      z: 169.49833682438145
      pitch: 90.0
      yaw: 10.444329
    take_range: 10
  find_efir_1:
    type: CHOICE
    uid: 2
    dialogs:
      main:
        message:
        - 23, 24 ... Так не пойдет!+
        - '[Что случилось?]'
        - '@C/quest int dialg2'
      dialg2:
        message:
        - У нас катострофически мало эфира!+Если так дльше пойдет, в скором времени+
        - мы не то что не сможем покинуть эту +планету, у нас энергии даже на+
        - зарядку щитов скоро не останется!+Большинство валькирий сейчас на+
        - важных заданиях, и мне не кому+поручить это дело .. +
        - '&2[Предложить помощь]'
        - '@C/quest int anstrue'
        - ' '
        - '&c[Отказать]+'
        - '@C/quest int ansfalse'
    lore:
    - '&e[В поисках эфира]+'
    - У инженера пхоже проблемы.+
    - Поговори с ней.
    choises:
    - ansfalse:find_efir_f
    - anstrue:find_efir_2
    interact_location:
      ==: org.bukkit.Location
      world: world
      x: -570.3844178742659
      y: 72.0
      z: 281.69181870114625
      pitch: 59.33592
      yaw: -46.146362
    interact_distance: 5
    take:
      is_cub_area: false
      range: 10
    take_range: 10
  find_efir_2:
    uid: 3
    dialogs:
      main:
        message:
        - Спасибо что откликнулся.+Не смотря на то, что эта планета+
        - богата криссталическим эфиром,+большую часть руды уже выроботали+
        - и отправили на Автократор, так что+сейчас планета переживает не+
        - лучшие времена ... Однако,+мы тут сами протянем копыта,+
        - если не найдем здесь хоть немного +эфира .. +
        - '&e[Спросить где находиться эфир]+'
        - '@C/quest int gdeefir'
        - '&2[Отправиться за эфром]'
        - '@C/quest int findmeefir'
      gdeefir:
        message:
        - Под землей, где же еще!+
        - По другую сторону врат находится+
        - заброшенная шахта кристаллического+
        - эфира. Если где и искать остатки+
        - '- то в первую очередь там.+'
        - Лучше всего подойдет притихва, +надеюсь ты справишься.
        - '&2[Отправиться за эфром]+'
        - '@C/quest int findmeefir'
    lore:
    - '&e[В поисках эфира]+'
    - У инженера пхоже проблемы.+
    - Поговори с ней.
    interact_location:
      ==: org.bukkit.Location
      world: world
      x: -570.3844178742659
      y: 72.0
      z: 281.69181870114625
      pitch: 59.33592
      yaw: -46.146362
    interact_distance: 5
    complate:
      key: findmeefir
    next_quest: find_efir_3
  find_efir_3:
    type: ITEM
    uid: 4
    dialogs:
      main:
        message:
        - Ты уже принес эфир?+
        - '&2[Отдать эфир]'
        - '@C/quest int confirm'
    interact_location:
      ==: org.bukkit.Location
      world: world
      x: -570.3844178742659
      y: 72.0
      z: 281.69181870114625
      pitch: 59.33592
      yaw: -46.146362
    interact_distance: 5
    complate:
      key: confirm
      exp: 150
      need_item_in_hand: I:blick_b4
      need_item_in_hand_ct: 2
  find_efir_f:
    uid: 5
    dialogs:
      main:
        message:
        - Эх, и у тебя тоже дел по горло ..+
        - Ладно, не смею тебя дальше задерживать.
    interact_location:
      ==: org.bukkit.Location
      world: world
      x: -570.3844178742659
      y: 72.0
      z: 281.69181870114625
      pitch: 59.33592
      yaw: -46.146362
    interact_distance: 5
